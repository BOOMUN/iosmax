map $http_upgrade $iosmax_connection_upgrade {
    default upgrade;
    '' close;
}

map $http_cf_connecting_ip $iosmax_limit_key {
    default $http_cf_connecting_ip;
    '' $binary_remote_addr;
}

limit_req_zone $iosmax_limit_key zone=iosmax_login:10m rate=6r/m;
limit_conn_zone $iosmax_limit_key zone=iosmax_connections:10m;

server {
    listen 127.0.0.1:18011;
    server_name _;
    server_tokens off;
    client_max_body_size 15m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), display-capture=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss:; media-src 'self' blob:; worker-src 'self' blob:" always;

    limit_conn iosmax_connections 20;

    location = /api/auth/login {
        limit_req zone=iosmax_login burst=4 nodelay;
        proxy_pass http://127.0.0.1:18010;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:18010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $iosmax_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:18010;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
